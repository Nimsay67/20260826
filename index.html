<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Página - Yasmin</title>
    <style>
        /* Configurações gerais da página */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6eb; /* Fundo rosa claro */
            color: #4a3b40; /* Cor do texto em um tom escuro suave */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Cartão centralizado que contém o conteúdo */
        .container {
            background-color: #ffffff; /* Fundo branco para o conteúdo contrastar */
            padding: 30px;
            border-radius: 20px; /* Bordas arredondadas */
            box-shadow: 0 8px 24px rgba(255, 182, 193, 0.4); /* Sombra suave rosa */
            max-width: 450px;
            width: 90%;
            text-align: center;
            border: 2px solid #ffb6c1; /* Borda rosa fina */
        }

        /* Estilização dos títulos */
        h1 {
            color: #d15276; /* Rosa mais escuro para destaque */
            font-size: 24px;
            margin-bottom: 10px;
        }

        h2 {
            color: #e07a97; /* Tom de rosa médio */
            font-size: 18px;
            margin-top: 25px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ffe6eb;
            padding-bottom: 8px;
        }

        /* Estilização dos textos e parágrafos */
        p {
            font-size: 15px;
            line-height: 1.6;
            margin: 8px 0;
        }

        /* Bloco com as informações de identificação */
        .info-box {
            background-color: #fff0f3; /* Fundo rosa bem suave */
            padding: 15px;
            border-radius: 12px;
            text-align: left; /* Alinha os dados à esquerda dentro do bloco */
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }

        .info-box p {
            margin: 6px 0;
        }

        strong {
            color: #d15276;
        }
    </style>
</head>
<body>

    <!-- Todo o conteúdo agora fica dentro desta caixa centralizada -->
    <div class="container">
        <h1>Minha Primeira Página</h1>
        
        <p>
            Olá! Esta é a minha primeira página criada em HTML 
            e publicada com o GitHub Pages.
        </p>

        <h2>Identificação</h2>

        <div class="info-box">
            <p><strong>Nome:</strong> Yasmin Gabrielly da Rosa</p>
            <p><strong>Número:</strong> 34</p>
            <p><strong>Turma:</strong> 1º Ano A</p>
        </div>
    </div>

</body>
</html>
